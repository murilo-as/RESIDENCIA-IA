# Configuração de todos os scripts. Vazio (null) = não informado.

llm:                      # LLM que extrai o pedido (etapa 1), não o modelo otimizado
  backend: gemini         # gemini | openai | llamacpp
  modelo: gemini-2.5-flash
  url: null               # só no backend openai

limites:
  memoria_gb:           # a etapa 3 corta o que não cabe
  banda_gb_s:          # máquina simulada (padrão do projeto: 89.6 = PC médio; Spark = 273)
  min_tok_s:            # meta de tokens/s
  folga_memoria: 0.20   # HIPOTESE: folga sobre o minimo teorico (pesos + KV); abaixo dela a config e "sem folga"
  eficiencia_banda: 0.45  # fracao da banda realmente usada no decode (1 medida: Qwen3.5-35B-A3B Q4_K_M no Spark, 82,4 tok/s)

familias: [Qwen]     # so estas familias entram (null = todas). Gemma saiu em 21/10/2026

saida: saidas
